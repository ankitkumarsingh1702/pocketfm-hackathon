[project]
name = "pocketfm-backend"
version = "0.1.0"
description = "Simulated Studio — persona-based story simulation engine on Google Vertex AI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "google-genai>=1.0",
    "google-cloud-firestore>=2.19",
    "anthropic[vertex]>=0.40",
    "pyyaml>=6.0.2",
    "neo4j>=5.25",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
