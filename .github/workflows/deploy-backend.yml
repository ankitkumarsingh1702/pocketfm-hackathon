name: deploy backend

# Backend entry point. There are two independent backend services:
#
#   simulated-studio        repo root      FastAPI + the built SPA
#   story-genre-convertor   backend/       standalone FastAPI, Gemini on Vertex
#                           story-genre-
#                           convertor/
#
# On a manual run you pick which one to ship. On a push to develop the workflow
# picks for you, from the paths that actually changed, so a convertor commit
# never rebuilds the studio image and vice versa.
#
# Auth is keyless via Workload Identity Federation. Run scripts/setup-cicd.sh
# once to create the WIF pool + deployer SA and set the repo variables.

on:
  push:
    branches: [develop]
    paths:
      - "backend/**"
      - "skills/**"
      - "data/**"
      - "Dockerfile"
      - ".github/workflows/deploy-backend.yml"
      - ".github/workflows/_deploy-studio.yml"
  workflow_dispatch:
    inputs:
      service:
        description: "Which backend service to deploy"
        type: choice
        required: true
        options:
          - all
          - simulated-studio
          - story-genre-convertor
      reason:
        description: "Why are you deploying? (shown in the run log)"
        type: string
        required: false

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

jobs:
  select:
    name: Pick services
    runs-on: ubuntu-latest
    outputs:
      studio: ${{ steps.pick.outputs.studio }}
      convertor: ${{ steps.pick.outputs.convertor }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history to diff the push range

      - name: Resolve which services to deploy
        id: pick
        run: |
          set -euo pipefail
          CHOICE="${{ github.event.inputs.service || '' }}"
          studio=false
          convertor=false

          if [ -n "${CHOICE}" ]; then
            echo "Manual run — deploying: ${CHOICE}"
            case "${CHOICE}" in
              all)                   studio=true; convertor=true ;;
              simulated-studio)      studio=true ;;
              story-genre-convertor) convertor=true ;;
              *) echo "::error::unknown service '${CHOICE}'"; exit 1 ;;
            esac
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "${BEFORE}" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              # Force-push or a brand-new branch: no reliable base to diff
              # against, so ship everything rather than silently skipping.
              echo "No usable base commit (${BEFORE:-none}) — deploying both services."
              studio=true; convertor=true
            else
              CHANGED="$(git diff --name-only "${BEFORE}" "${{ github.sha }}")"
              echo "Changed files:"
              echo "${CHANGED}" | sed 's/^/  /'
              CONV_RE='^backend/story-genre-convertor/'
              STUDIO_RE='^(backend/|skills/|data/|Dockerfile$|\.github/workflows/(deploy-backend|_deploy-studio)\.yml$)'
              if echo "${CHANGED}" | grep -qE "${CONV_RE}"; then convertor=true; fi
              # Everything under backend/ EXCEPT the convertor belongs to the
              # studio image, hence the -v filter before the studio match.
              if echo "${CHANGED}" | grep -vE "${CONV_RE}" | grep -qE "${STUDIO_RE}"; then studio=true; fi
            fi
          fi

          echo "studio=${studio}"       >> "$GITHUB_OUTPUT"
          echo "convertor=${convertor}" >> "$GITHUB_OUTPUT"
          {
            echo "### Backend deploy plan"
            echo ""
            echo "- \`simulated-studio\`: ${studio}"
            echo "- \`story-genre-convertor\`: ${convertor}"
          } >> "$GITHUB_STEP_SUMMARY"

  studio:
    name: Simulated Studio
    needs: select
    if: needs.select.outputs.studio == 'true'
    uses: ./.github/workflows/_deploy-studio.yml
    with:
      trigger: backend — ${{ github.event.inputs.reason || 'push to develop' }}

  convertor:
    name: Story Genre Convertor
    needs: select
    if: needs.select.outputs.convertor == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-story-genre-convertor
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      SERVICE: ${{ vars.GENRE_CONVERTOR_SERVICE || 'story-genre-convertor' }}
    defaults:
      run:
        working-directory: backend/story-genre-convertor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy context
        run: |
          echo "Service: ${SERVICE}"
          echo "Trigger: ${{ github.event.inputs.reason || 'push to develop' }}"
          echo "Actor:   ${{ github.actor }}"
          echo "Commit:  ${{ github.sha }}"

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          set -euo pipefail
          # Built from this directory, not the repo root — the convertor has its
          # own Dockerfile and .gcloudignore and shares no code with the studio.
          #
          # These flags mirror ./deploy.sh; see the comments there for the full
          # reasoning. In short: conversion runs on a background thread with
          # process-local job state, so the service must stay warm (min 1), stay
          # single (max 1), and keep CPU outside request handling.
          gcloud run deploy "${SERVICE}" \
            --source . \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --allow-unauthenticated \
            --memory 1Gi --cpu 1 \
            --min-instances 1 --max-instances 1 \
            --no-cpu-throttling \
            --concurrency 40 \
            --timeout 300 \
            --set-env-vars "GOOGLE_CLOUD_PROJECT=${{ vars.GCP_PROJECT_ID }},VERTEX_LOCATION=${{ vars.GCP_REGION }},GEMINI_MODEL=${{ vars.GEMINI_MODEL || 'gemini-3.1-pro-preview' }},CACHE_DIR=/tmp/sgc-cache" \
            --quiet
          URL="$(gcloud run services describe "${SERVICE}" \
            --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" \
            --format 'value(status.url)')"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          {
            echo "### Story Genre Convertor deployed to Cloud Run"
            echo ""
            echo "- Service: \`${SERVICE}\`"
            echo "- URL: ${URL}"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Trigger: ${{ github.event.inputs.reason || 'push to develop' }} (${{ github.actor }})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test /health and /api/genres
        run: |
          set -uo pipefail
          URL="${{ steps.deploy.outputs.url }}"
          for path in /health /api/genres; do
            ok=""
            for i in 1 2 3 4 5 6; do
              code="$(curl -s -o /dev/null -w '%{http_code}' "${URL}${path}" || true)"
              if [ "${code}" = "200" ]; then echo "${path} OK"; ok=1; break; fi
              echo "attempt ${i} on ${path}: HTTP ${code}"; sleep 5
            done
            if [ -z "${ok}" ]; then
              echo "::error::${path} did not return 200"; exit 1
            fi
          done
