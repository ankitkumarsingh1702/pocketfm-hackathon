name: _deploy-studio

# Reusable build & deploy of the Simulated Studio Cloud Run service.
#
# The frontend and the backend ship in the SAME container image — the root
# Dockerfile builds the Vite SPA and FastAPI serves it as static files. So a
# "frontend deploy" and a "backend deploy" are the same build; only the reason
# for running it differs. This lives in one reusable workflow so the two entry
# points (deploy-frontend.yml, deploy-backend.yml) cannot drift apart on flags,
# secrets, or smoke tests.
#
# Not runnable on its own — it has no push or dispatch trigger.

on:
  workflow_call:
    inputs:
      trigger:
        description: "Human-readable reason, echoed into the run log"
        type: string
        required: false
        default: ""
    outputs:
      url:
        description: "Public URL of the deployed service"
        value: ${{ jobs.deploy.outputs.url }}

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

jobs:
  deploy:
    name: Build & deploy Simulated Studio
    runs-on: ubuntu-latest
    # Shared across both entry points on purpose: a frontend deploy and a
    # backend deploy target one service and must never overlap.
    concurrency:
      group: deploy-simulated-studio
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy context
        run: |
          echo "Service: ${{ vars.CLOUD_RUN_SERVICE }}"
          echo "Trigger: ${{ inputs.trigger || github.event_name }}"
          echo "Actor:   ${{ github.actor }}"
          echo "Commit:  ${{ github.sha }}"

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          set -euo pipefail
          # Mount Neo4j knowledge-graph secrets only if they exist in Secret
          # Manager; otherwise deploy without them (the app degrades gracefully).
          SECRET_FLAGS=()
          if gcloud secrets describe NEO4J_URI --project "${{ vars.GCP_PROJECT_ID }}" >/dev/null 2>&1; then
            SECRET_FLAGS+=(--set-secrets "NEO4J_URI=NEO4J_URI:latest,NEO4J_USERNAME=NEO4J_USERNAME:latest,NEO4J_PASSWORD=NEO4J_PASSWORD:latest")
            echo "Mounting Neo4j secrets from Secret Manager."
          else
            echo "No NEO4J_URI secret found — deploying without the knowledge graph."
          fi
          # The stateful 1,000-agent planner streams progress for several
          # minutes. Keep the connection alive while still bounding a run.
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE }}" \
            --source . \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --allow-unauthenticated \
            --memory 1Gi --cpu 1 --timeout 900 --max-instances 1 \
            --set-env-vars "GOOGLE_CLOUD_PROJECT=${{ vars.GCP_PROJECT_ID }}" \
            ${SECRET_FLAGS[@]+"${SECRET_FLAGS[@]}"} \
            --quiet
          URL="$(gcloud run services describe "${{ vars.CLOUD_RUN_SERVICE }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" \
            --format 'value(status.url)')"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          {
            echo "### Simulated Studio deployed to Cloud Run"
            echo ""
            echo "- Service: \`${{ vars.CLOUD_RUN_SERVICE }}\`"
            echo "- URL: ${URL}"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Trigger: ${{ inputs.trigger || github.event_name }} (${{ github.actor }})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test /health
        run: |
          set -uo pipefail
          URL="${{ steps.deploy.outputs.url }}"
          for i in 1 2 3 4 5 6; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "${URL}/health" || true)"
            if [ "${code}" = "200" ]; then echo "health OK"; exit 0; fi
            echo "attempt ${i}: HTTP ${code}"; sleep 5
          done
          echo "::error::health check did not return 200"; exit 1
