name: no-ai-attribution

# Hard gate: fail any PR whose commit messages, title, or body attribute the
# work to an AI assistant. Runs server-side so it can't be skipped locally.

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan commit messages + PR title/body for AI attribution
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Keep this pattern in sync with .githooks/commit-msg
          pattern='🤖|co-authored-by:.*(claude|anthropic)|noreply@anthropic\.com|generated with \[?(claude|ai|an ai)|claude[ -]?code|chatgpt|copilot'
          fail=0

          echo "Scanning commits ${BASE_SHA}..${HEAD_SHA}"
          for sha in $(git rev-list "${BASE_SHA}..${HEAD_SHA}"); do
            if git log -1 --format='%B' "$sha" | grep -iEq "$pattern"; then
              echo "::error::commit $sha contains AI-assistant attribution in its message"
              fail=1
            fi
          done

          if printf '%s\n%s' "${PR_TITLE:-}" "${PR_BODY:-}" | grep -iEq "$pattern"; then
            echo "::error::PR title/body contains AI-assistant attribution"
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "Remove AI-assistant attribution (🤖, 'Co-Authored-By: Claude/Anthropic', 'Generated with …') and re-push." >&2
            exit 1
          fi
          echo "OK — no AI attribution found."
