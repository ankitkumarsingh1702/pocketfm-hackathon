name: deploy

# Production deploy of Simulated Studio (single Cloud Run service — FastAPI
# serves the built React SPA).
#
# Auth is keyless via Workload Identity Federation — no service-account JSON key
# is stored in GitHub. Run scripts/setup-cicd.sh once to create the WIF pool +
# deployer service account and set the repo variables this workflow reads.
#
# Triggers:
#   1. push to develop (i.e. a merged PR) that touches app code -> auto-deploy
#   2. workflow_dispatch -> any developer can deploy on demand ("Run workflow")

on:
  push:
    branches: [develop]
    paths:
      - "backend/**"
      - "frontend/**"
      - "skills/**"
      - "data/**"
      - "Dockerfile"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      component:
        description: "Component to deploy (one service currently serves both)"
        type: choice
        options: [all, backend, frontend]
        default: all
      reason:
        description: "Why are you deploying? (shown in the run log)"
        type: string
        required: false

# Never let two deploys of the same service race; newer waits for older.
concurrency:
  group: deploy-simulated-studio
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

jobs:
  deploy:
    name: Build & deploy to Cloud Run
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy context
        run: |
          echo "Trigger:   ${{ github.event_name }}"
          echo "Component: ${{ github.event.inputs.component || 'all (push to develop)' }}"
          echo "Reason:    ${{ github.event.inputs.reason || 'merge to develop' }}"
          echo "Actor:     ${{ github.actor }}"
          echo "Commit:    ${{ github.sha }}"

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          set -euo pipefail
          # Mount Neo4j knowledge-graph secrets only if they exist in Secret
          # Manager; otherwise deploy without them (the app degrades gracefully).
          SECRET_FLAGS=()
          if gcloud secrets describe NEO4J_URI --project "${{ vars.GCP_PROJECT_ID }}" >/dev/null 2>&1; then
            SECRET_FLAGS+=(--set-secrets "NEO4J_URI=NEO4J_URI:latest,NEO4J_USERNAME=NEO4J_USERNAME:latest,NEO4J_PASSWORD=NEO4J_PASSWORD:latest")
            echo "Mounting Neo4j secrets from Secret Manager."
          else
            echo "No NEO4J_URI secret found — deploying without the knowledge graph."
          fi
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE }}" \
            --source . \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --allow-unauthenticated \
            --memory 1Gi --cpu 1 --timeout 300 \
            --set-env-vars "GOOGLE_CLOUD_PROJECT=${{ vars.GCP_PROJECT_ID }}" \
            ${SECRET_FLAGS[@]+"${SECRET_FLAGS[@]}"} \
            --quiet
          URL="$(gcloud run services describe "${{ vars.CLOUD_RUN_SERVICE }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" --region "${{ vars.GCP_REGION }}" \
            --format 'value(status.url)')"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployed to Cloud Run"
            echo ""
            echo "- Service: \`${{ vars.CLOUD_RUN_SERVICE }}\`"
            echo "- URL: ${URL}"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Triggered by: ${{ github.actor }} (${{ github.event_name }})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test /health
        run: |
          set -uo pipefail
          URL="${{ steps.deploy.outputs.url }}"
          for i in 1 2 3 4 5 6; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "${URL}/health" || true)"
            if [ "${code}" = "200" ]; then echo "health OK"; exit 0; fi
            echo "attempt ${i}: HTTP ${code}"; sleep 5
          done
          echo "::error::health check did not return 200"; exit 1
